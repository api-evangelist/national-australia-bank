cvv_expiry:
  expiry: Use any expiration date after today's date if none is provided.
  cvv: >-
    If the card verification code is required and not provided, use any 3-digit
    combination for Visa, Mastercard, Discover, Diners Club and JCB; any 4-digit
    combination for American Express.
response_triggers:
  field: orderInformation.amountDetails.totalAmount
  values:
    - amount: "1"
      result: AUTHORIZED
    - amount: "-1"
      result: INVALID_REQUEST (reason INVALID_DATA)
