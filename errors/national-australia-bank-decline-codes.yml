note: NAB Gateway (CyberSource-powered) transaction response codes, transcribed from the downloadable responsecode.json linked from the NAB Developer Portal response-codes page. Applies to the Gateway Payments
  API only, not the CDR Open Banking surface. The docs publish no list of codes masked from buyers.
envelope:
  status_field: status
  reason_field: errorInformation.reason
  note: 'Per the docs: "In declined or unsuccessful transactions, the API reply includes an ''errorInformation'' object and a ''status'' field. The ''errorInformation'' object contains a ''reason'' field."'
http_statuses:
- status: 201
  meaning: This HTTP status code confirms that the NAB API created a transaction resource ID. If you get this HTTP status code for an unsuccessful transaction, NAB or the merchant's processor probably marked
    this transaction as under review, declined, or failed.
- status: 400
  meaning: This HTTP status code indicates something is wrong or missing in the merchant's request. Try to correct the request and resubmit it.
- status: 502
  meaning: This HTTP status code indicates either a server error or timeout. Retry the transaction, and contact customer support if you need to investigate further.
masked_to_buyers: null
