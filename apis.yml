apis:
- aid: national-australia-bank:national-australia-bank-gateway-payments-api
  name: National Australia Bank (NAB) Gateway Payments API
  tags:
  - Payments
  - Merchant
  - Tokenization
  - Invoicing
  - Reporting
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://nabgateway-developer.nab.com.au/
  properties:
  - url: https://nabgateway-developer.nab.com.au/
    type: DeveloperPortal
  - url: https://nabgateway-developer.nab.com.au/api-reference-assets/index.html
    type: APIReference
  - url: https://nabgateway-developer.nab.com.au/api/developer-guides.html
    type: Documentation
  - url: https://nabgateway-developer.nab.com.au/hello-world.html
    type: GettingStarted
  description: >-
    NAB's first-party merchant payments REST API platform (the NAB Gateway / NAB Transact developer portal
    at nabgateway-developer.nab.com.au), distinct from the CDR Open Banking surface. Documents a full
    merchant-acquiring API set - Payments (online and card-present, incl. Google Pay and Apple Pay), Token
    Management, Flex Microform (PCI-DSS scope reduction), Stored Credentials, Invoicing, Reporting, Transaction
    Search, Transaction Details and Transaction Batches - with field-level reference, code samples and
    a sandbox. Access is merchant-registered and the OpenAPI/Swagger is not published for public download
    (the reference renders in a client-side app), so this entry is documentation-only with no harvested
    spec; humanURL points at the live developer portal (HTTP 200).
