apis:
- aid: national-australia-bank:national-australia-bank-cdr-product-reference-data-api
  name: National Australia Bank (NAB) CDR Product Reference Data API
  tags:
  - CDR
  - Open Banking
  - Product Reference Data
  - Banking
  - Consumer Data Right
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.nab.com.au/docs/open-banking
  baseURL: https://openbank.api.nab.com.au/cds-au/v1/banking/products
  properties:
  - url: https://developer.nab.com.au/docs/open-banking
    type: Documentation
  - url: https://consumerdatastandardsaustralia.github.io/standards/#get-products
    type: APIReference
  - url: openapi/national-australia-bank-cds-banking-products-openapi.yml
    type: OpenAPI
  description: NAB's public, unauthenticated Consumer Data Right (CDR) Product
    Reference Data API. GET /banking/products (and /banking/products/{productId})
    returns NAB's openly published banking product catalogue - home loans, deposits,
    credit cards, business products and more - with fees, rates, eligibility and
    terms. Conforms to the DSB Consumer Data Standards (CDS) Banking API. Confirmed
    live returning HTTP 200 (with x-v response header) at
    https://openbank.api.nab.com.au/cds-au/v1/banking/products. This is the only
    PUBLIC (unauthenticated) endpoint family in the CDR Banking surface; the
    account/transaction/payment families below require a consumer-authorized CDR flow.
- aid: national-australia-bank:national-australia-bank-cdr-accounts-balances-api
  name: National Australia Bank (NAB) CDR Accounts & Balances API
  tags:
  - CDR
  - Open Banking
  - Accounts
  - Balances
  - Consumer Data Right
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.nab.com.au/docs/open-banking
  baseURL: https://openbank.api.nab.com.au/cds-au/v1/banking/accounts
  properties:
  - url: https://developer.nab.com.au/docs/open-banking
    type: Documentation
  - url: https://consumerdatastandardsaustralia.github.io/standards/#get-accounts
    type: APIReference
  - url: openapi/national-australia-bank-cds-banking-products-openapi.yml
    type: OpenAPI
  description: NAB's consumer-AUTHORIZED Consumer Data Right (CDR) Accounts and
    Balances surface, part of the DSB Consumer Data Standards (CDS) Banking API that
    NAB is legally mandated to implement as a data holder. Covers Get Accounts
    (GET /banking/accounts), Get Account Detail (/banking/accounts/{accountId}),
    Get Bulk Balances (/banking/accounts/balances) and Get Account Balance
    (/banking/accounts/{accountId}/balance). Access is via the accredited CDR ADR
    model - the consumer must authorize a data recipient; a bare request to
    https://openbank.api.nab.com.au/cds-au/v1/banking/accounts returns HTTP 403
    (unauthorized) as expected. Endpoint definitions harvested verbatim from the
    shared DSB standard, not bank-proprietary.
- aid: national-australia-bank:national-australia-bank-cdr-transactions-api
  name: National Australia Bank (NAB) CDR Transactions API
  tags:
  - CDR
  - Open Banking
  - Transactions
  - Banking
  - Consumer Data Right
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.nab.com.au/docs/open-banking
  baseURL: https://openbank.api.nab.com.au/cds-au/v1/banking/accounts
  properties:
  - url: https://developer.nab.com.au/docs/open-banking
    type: Documentation
  - url: https://consumerdatastandardsaustralia.github.io/standards/#get-transactions-for-account
    type: APIReference
  - url: openapi/national-australia-bank-cds-banking-products-openapi.yml
    type: OpenAPI
  description: NAB's consumer-AUTHORIZED Consumer Data Right (CDR) Transactions
    surface from the DSB Consumer Data Standards (CDS) Banking API. Covers Get
    Transactions For Account (GET /banking/accounts/{accountId}/transactions) and
    Get Transaction Detail (/banking/accounts/{accountId}/transactions/{transactionId}),
    returning debits, credits, descriptions, amounts and status for an authorized
    consumer's NAB accounts. Access requires a consumer-authorized CDR ADR flow
    (accreditation with the ACCC); it is not a public endpoint. Endpoint definitions
    harvested verbatim from the shared DSB standard, not bank-proprietary.
