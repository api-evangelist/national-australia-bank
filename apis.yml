name: National Australia Bank
kind: company
description: National Australia Bank (NAB) is one of Australia's "Big Four" banks and
  a major Authorised Deposit-taking Institution (ADI), headquartered in Melbourne
  and publicly listed on the Australian Securities Exchange (ASX:NAB) - a shareholder-owned
  institution rather than a customer-owned mutual. NAB serves retail, business,
  corporate, and institutional customers across Australia and New Zealand. As a
  regulated ADI, NAB is a mandated data holder under Australia's Consumer Data Right
  (CDR / Open Banking) and exposes a public, unauthenticated Product Reference Data
  (PRD) API conforming to the DSB Consumer Data Standards (CDS), alongside its
  accredited-only consumer data sharing surface and a public developer portal.
