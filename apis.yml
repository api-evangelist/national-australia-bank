  - url: https://consumerdatastandardsaustralia.github.io/standards/#get-direct-debits-for-account
    type: APIReference
  - url: openapi/national-australia-bank-cds-banking-products-openapi.yml
    type: OpenAPI
  description: NAB's consumer-AUTHORIZED Consumer Data Right (CDR) Direct Debits and
    Scheduled Payments surface from the DSB Consumer Data Standards (CDS) Banking API.
    Covers Get Direct Debits For Account (/banking/accounts/{accountId}/direct-debits),
    Get Bulk Direct Debits (/banking/accounts/direct-debits), Get Scheduled Payments
    For Account (/banking/accounts/{accountId}/payments/scheduled) and Get Bulk
    Scheduled Payments (/banking/payments/scheduled). Access requires a
    consumer-authorized CDR ADR flow; it is not a public endpoint. Endpoint
    definitions harvested verbatim from the shared DSB standard, not bank-proprietary.
- aid: national-australia-bank:national-australia-bank-cdr-payees-api
  name: National Australia Bank (NAB) CDR Payees API
  tags:
  - CDR
  - Open Banking
  - Payees
  - Banking
  - Consumer Data Right
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.nab.com.au/docs/open-banking
  baseURL: https://openbank.api.nab.com.au/cds-au/v1/banking/payees
  properties:
  - url: https://developer.nab.com.au/docs/open-banking
    type: Documentation
  - url: https://consumerdatastandardsaustralia.github.io/standards/#get-payees
    type: APIReference
  - url: openapi/national-australia-bank-cds-banking-products-openapi.yml
    type: OpenAPI
  description: NAB's consumer-AUTHORIZED Consumer Data Right (CDR) Payees surface
    from the DSB Consumer Data Standards (CDS) Banking API. Covers Get Payees
    (GET /banking/payees) and Get Payee Detail (/banking/payees/{payeeId}),
    returning the saved payees (domestic, international, biller) an authorized
    consumer has configured on their NAB accounts. Access requires a
    consumer-authorized CDR ADR flow; it is not a public endpoint. Endpoint
    definitions harvested verbatim from the shared DSB standard, not bank-proprietary.
- aid: national-australia-bank:national-australia-bank-gateway-payments-api
  name: National Australia Bank (NAB) Gateway Payments API
  tags:
  - Payments
  - Merchant
  - Tokenization
  - Invoicing
  - Reporting
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://nabgateway-developer.nab.com.au/
  properties:
  - url: https://nabgateway-developer.nab.com.au/
    type: DeveloperPortal
  - url: https://nabgateway-developer.nab.com.au/api-reference-assets/index.html
    type: APIReference
  - url: https://nabgateway-developer.nab.com.au/api/developer-guides.html
    type: Documentation
  - url: https://nabgateway-developer.nab.com.au/hello-world.html
    type: GettingStarted
  description: NAB's first-party merchant payments REST API platform (the NAB
    Gateway / NAB Transact developer portal at nabgateway-developer.nab.com.au),
    distinct from the CDR Open Banking surface. Documents a full merchant-acquiring
    API set - Payments (online and card-present, incl. Google Pay and Apple Pay),
    Token Management, Flex Microform (PCI-DSS scope reduction), Stored Credentials,
    Invoicing, Reporting, Transaction Search, Transaction Details and Transaction
    Batches - with field-level reference, code samples and a sandbox. Access is
    merchant-registered and the OpenAPI/Swagger is not published for public download
    (the reference renders in a client-side app), so this entry is documentation-only
    with no harvested spec; humanURL points at the live developer portal (HTTP 200).
