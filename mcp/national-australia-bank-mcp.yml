note: 'National Australia Bank publishes NO MCP server of its own: developer.nab.com.au/llms.txt returns the HTML app shell (no llms.txt), www.nab.com.au/llms.txt (200, 9,808 B) does not mention MCP, and
  the pre-flight MCP-docs probe found no-mcp-docs-found; openbank.api.nab.com.au/mcp answered 403 with an identical 403 control (opaque, proves nothing). The ONLY MCP surface reachable from NAB''s own properties
  is on the NAB Gateway developer portal (nabgateway-developer.nab.com.au), a white-label of the Cybersource Developer Center: its llms.txt (200, 148,349 B) has an ''Agent Toolkit & MCP'' section linking
  the Visa Acceptance Agent Toolkit, whose MCP Server Quick Start states ''This is a local MCP server'' run with npx. It is published by Visa Acceptance Solutions (Cybersource), not by NAB, documented as
  pilot phase, and the docs do not say whether NAB Gateway merchant credentials work with it. Not called by us.'
server:
